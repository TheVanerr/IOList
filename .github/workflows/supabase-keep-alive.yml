name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu tam gecmisle al
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gerekirse bos keep-alive commit olustur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
          NOW_EPOCH=$(date -u +%s)
          AGE_DAYS=$(((NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400))
          echo "Son commit yasi: ${AGE_DAYS} gun"
          if [ "$AGE_DAYS" -ge 55 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep repo active [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Bos keep-alive commit gonderildi."
          else
            echo "Bos commit gerekmedi."
          fi

      - name: Supabase'e ping at
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PING_TABLE: ${{ vars.SUPABASE_PING_TABLE }}
          SUPABASE_PING_FALLBACK: ${{ vars.SUPABASE_PING_FALLBACK }}
        run: |
          set -euo pipefail
          # io.html stores SUPA_URL and SUPA_KEY as single-line JavaScript const assignments.
          # GitHub-hosted Ubuntu runners include python3, which we use to read the committed app config.
          declare -A APP_SUPABASE_CONFIG=()
          while IFS=$'\t' read -r name value; do
            [ -n "${name}" ] || continue
            APP_SUPABASE_CONFIG["${name}"]="${value}"
          done < <(python3 - <<'PY'
          import ast, pathlib, re, sys
          path = pathlib.Path("io.html")
          text = path.read_text(encoding="utf-8") if path.exists() else ""
          for name in ("SUPA_URL", "SUPA_KEY"):
              match = re.search(rf'^[ \t]*const\s+{name}\s*=\s*(?P<literal>\'(?:\\.|[^\'\\])*\'|"(?:\\.|[^"\\])*")\s*;\s*$', text, re.MULTILINE)
              if not match:
                  print(f"warning: {name} not found in io.html, will attempt fallback to GitHub secrets", file=sys.stderr)
                  continue
              try:
                  value = ast.literal_eval(match.group("literal"))
              except (SyntaxError, ValueError):
                  print(f"warning: {name} in io.html could not be parsed, will attempt fallback to GitHub secrets", file=sys.stderr)
                  continue
              print(f"{name}\t{value}")
          PY
          )
          APP_SUPABASE_URL="${APP_SUPABASE_CONFIG[SUPA_URL]:-}"
          APP_SUPABASE_KEY="${APP_SUPABASE_CONFIG[SUPA_KEY]:-}"
          BASE_URL="${APP_SUPABASE_URL:-${SUPABASE_URL:-}}"
          if [ -z "${BASE_URL}" ]; then
            echo "Supabase URL not found. Check io.html or the SUPABASE_URL GitHub secret."
            exit 1
          fi
          # Use the public app config first so the keep-alive ping cannot drift from io.html.
          ANON_KEY_SOURCE="io.html"
          ANON_KEY="${APP_SUPABASE_KEY:-}"
          if [ -z "${ANON_KEY}" ]; then
            ANON_KEY_SOURCE="SUPABASE_ANON_KEY GitHub secret"
            ANON_KEY="${SUPABASE_ANON_KEY:-}"
          fi
          if [ -z "${ANON_KEY}" ]; then
            echo "Supabase anon key not found. Check io.html or the SUPABASE_ANON_KEY GitHub secret."
            exit 1
          fi
          echo "Supabase anon key source: ${ANON_KEY_SOURCE}"
          PRIMARY="${SUPABASE_PING_TABLE:-urun_katalogu}"
          FALLBACK="${SUPABASE_PING_FALLBACK:-projects}"
          TABLES="${PRIMARY} ${FALLBACK}"

          ping_table() {
            local table="$1"
            local url="${BASE_URL}/rest/v1/${table}?select=id&limit=1"
            local status="000"
            local attempt
            for attempt in 1 2 3; do
              status=$(curl -sS -o /tmp/sb-body -w "%{http_code}" \
                --connect-timeout 15 --max-time 30 \
                "${url}" \
                -H "apikey: ${ANON_KEY}" \
                -H "Authorization: Bearer ${ANON_KEY}" \
                -H "Accept: application/json") || status="000"
              echo "${table} deneme ${attempt}: HTTP ${status}"
              case "${status}" in
                200|206)
                  echo "Supabase aktif (${table}), ping basarili."
                  return 0
                  ;;
                404)
                  echo "${table} bulunamadi (PGRST205?), sonraki tablo deneniyor."
                  return 2
                  ;;
                000)
                  sleep 10
                  ;;
                *)
                  echo "Beklenmeyen yanit (${table}):"
                  head -c 500 /tmp/sb-body || true
                  echo
                  return 1
                  ;;
              esac
            done
            echo "${table}: baglanti kurulamadi (HTTP ${status})."
            return 3
          }

          tried=""
          for table in ${TABLES}; do
            case " ${tried} " in
              *" ${table} "*) continue ;;
            esac
            tried="${tried} ${table}"
            if ping_table "${table}"; then
              exit 0
            fi
            rc=$?
            if [ "${rc}" -eq 1 ]; then
              exit 1
            fi
          done

          echo "Hicbir tabloya basarili ping atilamadi. vars.SUPABASE_PING_TABLE ile mevcut bir tablo adi verin."
          exit 1
