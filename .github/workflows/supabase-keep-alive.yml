name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu tam gecmisle al
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gerekirse bos keep-alive commit olustur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
          NOW_EPOCH=$(date -u +%s)
          AGE_DAYS=$(((NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400))
          echo "Son commit yasi: ${AGE_DAYS} gun"
          if [ "$AGE_DAYS" -ge 55 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep repo active [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Bos keep-alive commit gonderildi."
          else
            echo "Bos commit gerekmedi."
          fi

      - name: Supabase'e ping at
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PING_TABLE: ${{ vars.SUPABASE_PING_TABLE }}
          SUPABASE_PING_FALLBACK: ${{ vars.SUPABASE_PING_FALLBACK }}
        run: |
          set -euo pipefail

          # io.html'den kimlik bilgilerini oku (birincil kaynak)
          HTML_URL=$(grep -oP "const\s+SUPA_URL\s*=\s*'\K[^']+" io.html 2>/dev/null || true)
          HTML_KEY=$(grep -oP "const\s+SUPA_KEY\s*=\s*'\K[^']+" io.html 2>/dev/null || true)
          [ -n "${HTML_URL}" ] && echo "URL io.html'den alindi." || echo "URL io.html'de bulunamadi, yedek kullaniliyor."
          [ -n "${HTML_KEY}" ] && echo "KEY io.html'den alindi." || echo "KEY io.html'de bulunamadi, SUPABASE_ANON_KEY secret kullaniliyor."

          BASE_URL="${HTML_URL:-${SUPABASE_URL:-https://gkeqdwsxukgejwnoenwk.supabase.co}}"
          ANON_KEY="${HTML_KEY:-${SUPABASE_ANON_KEY:-}}"

          if [ -z "${ANON_KEY}" ]; then
            echo "Hata: Supabase API anahtari bulunamadi (io.html ve SUPABASE_ANON_KEY secret kontrol edin)."
            exit 1
          fi

          PRIMARY="${SUPABASE_PING_TABLE:-urun_katalogu}"
          FALLBACK="${SUPABASE_PING_FALLBACK:-projects}"
          TABLES="${PRIMARY} ${FALLBACK}"

          ping_table() {
            local table="$1"
            local url="${BASE_URL}/rest/v1/${table}?select=id&limit=1"
            local status="000"
            local attempt
            for attempt in 1 2 3; do
              status=$(curl -sS -o /tmp/sb-body -w "%{http_code}" \
                --connect-timeout 15 --max-time 30 \
                "${url}" \
                -H "apikey: ${ANON_KEY}" \
                -H "Authorization: Bearer ${ANON_KEY}" \
                -H "Accept: application/json") || status="000"
              echo "${table} deneme ${attempt}: HTTP ${status}"
              case "${status}" in
                200|206)
                  echo "Supabase aktif (${table}), ping basarili."
                  return 0
                  ;;
                404)
                  echo "${table} bulunamadi (PGRST205?), sonraki tablo deneniyor."
                  return 2
                  ;;
                000)
                  sleep 10
                  ;;
                *)
                  echo "Beklenmeyen yanit (${table}):"
                  head -c 500 /tmp/sb-body || true
                  echo
                  return 1
                  ;;
              esac
            done
            echo "${table}: baglanti kurulamadi (HTTP ${status})."
            return 3
          }

          tried=""
          for table in ${TABLES}; do
            case " ${tried} " in
              *" ${table} "*) continue ;;
            esac
            tried="${tried} ${table}"
            if ping_table "${table}"; then
              exit 0
            fi
            rc=$?
            if [ "${rc}" -eq 1 ]; then
              exit 1
            fi
          done

          echo "Hicbir tabloya basarili ping atilamadi. vars.SUPABASE_PING_TABLE ile mevcut bir tablo adi verin."
          exit 1
